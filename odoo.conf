[options]
; El orden manda: lo primero gana. Los modulos propios pueden sobreescribir
; a los de Odoo sin tocar el fuente.
addons_path = /mnt/custom_addons,/mnt/vendor_addons,/opt/odoo/odoo/addons

data_dir = /var/lib/odoo

; Detras del proxy de Dokploy (Traefik).
proxy_mode = True

; Deshabilita el gestor de bases de datos por web en produccion.
list_db = False

; Base fijada. Con list_db=False no hay gestor web, asi que la BD se sirve
; solo por su nombre y el dbfilter impide que Odoo intente resolverla por host.
; La creacion inicial la hace entrypoint.sh una unica vez (idempotente).
db_name = importadora_staging
dbfilter = ^importadora_staging$

; --- Rendimiento en produccion (VPS 4 vCPU / 8 GB) -----------------------
; workers = (2 x nucleos) + 1, acotado por RAM al compartir host con Postgres.
; Con workers > 0 Odoo abre el puerto gevent 8072 (websockets / chat en vivo).
workers = 5
max_cron_threads = 1

; Un worker que supere el limite blando se recicla tras la peticion; el duro
; lo mata en el acto. ~640 MB / ~800 MB por worker (bytes).
limit_memory_soft = 671088640
limit_memory_hard = 838860800

; Cortan peticiones colgadas. El cron tiene mas margen (informes, imports).
limit_time_cpu = 60
limit_time_real = 120
limit_time_real_cron = 300
limit_request = 8192

; Conexiones a Postgres por worker. (workers + 2) x db_maxconn debe caber en
; el max_connections de Postgres (elevado a 200 en docker-compose.yml).
db_maxconn = 20

; NO declarar db_host / db_port / db_user / db_password aqui.
; El entrypoint los inyecta desde las variables de entorno HOST, PORT, USER y
; PASSWORD, pero SOLO si no estan presentes en este archivo. Dejandolos fuera,
; las credenciales viven en Dokploy y nunca se versionan.
; admin_passwd (master password) tambien lo inyecta el entrypoint desde
; ADMIN_PASSWD, por el mismo motivo.

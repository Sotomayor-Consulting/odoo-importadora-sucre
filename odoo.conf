[options]
; Este archivo lleva SOLO lo que es igual en todos los entornos. Es identico
; en las ramas staging y main.
;
; Todo lo que cambia entre produccion y staging (base, credenciales, workers,
; limites) llega por variables de entorno, que Odoo 19 lee de forma nativa:
;   PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE  -> conexion y base
;   ODOO_<OPCION>                                   -> cualquier otra opcion
;                                                      (ODOO_WORKERS, ODOO_DBFILTER...)
; Precedencia: linea de comandos > entorno > este archivo > valor por defecto.
; Las variables se definen en Dokploy; ver env.example.
;
; NO declarar aqui db_*, admin_passwd, dbfilter, workers ni limit_*: dejarian
; de ser por entorno y, en el caso de las credenciales, quedarian versionadas.

; El orden manda: lo primero gana. Los modulos propios pueden sobreescribir
; a los de Odoo sin tocar el fuente.
addons_path = /mnt/custom_addons,/mnt/shared,/opt/odoo/odoo/addons

data_dir = /var/lib/odoo

; Dentro del contenedor hay que escuchar en todas las interfaces para que el
; proxy lo alcance. Explicito porque el valor por defecto cambia en Odoo 20.
http_interface = 0.0.0.0

; Detras del proxy de Dokploy (Traefik).
proxy_mode = True

; Deshabilita el gestor de bases de datos por web. La base se crea en
; entrypoint.sh la primera vez y se sirve solo por su nombre.
list_db = False

[options]
; El orden manda: lo primero gana. Los modulos propios pueden sobreescribir
; a los de Odoo sin tocar el fuente.
addons_path = /mnt/custom_addons,/mnt/vendor_addons,/opt/odoo/odoo/addons

data_dir = /var/lib/odoo

; Detras del proxy de Dokploy (Traefik).
proxy_mode = True

; Deshabilita el gestor de bases de datos por web en produccion.
list_db = False

; NO declarar db_host / db_port / db_user / db_password aqui.
; El entrypoint oficial los inyecta desde las variables de entorno HOST, PORT,
; USER y PASSWORD, pero SOLO si no estan presentes en este archivo. Dejandolos
; fuera, las credenciales viven en Dokploy y nunca se versionan.

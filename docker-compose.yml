services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Solo en la red interna: la base NUNCA se expone a la red compartida
    # del proxy. Es la razon de separar las dos redes.
    networks:
      - internal
    restart: unless-stopped

  odoo:
    build:
      context: .
      secrets:
        - r2_url
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Consumidas por entrypoint.sh para construir los argumentos de
      # conexion. Ver el comentario en odoo.conf.
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Filestore y sesiones. Sin esto se pierden los adjuntos en cada
      # redespliegue y las sesiones se invalidan.
      - odoo-data:/var/lib/odoo
    expose:
      - "8069"   # HTTP
      - "8072"   # websockets (chat, notificaciones en vivo)
    networks:
      - internal          # para hablar con la base
      - dokploy-network   # para que el proxy lo alcance
    restart: unless-stopped

# La URL prefirmada de R2 se toma de la variable R2_URL que define Dokploy.
# Verificado: Compose la resuelve desde el archivo .env que Dokploy genera,
# sin necesidad de exportarla en el shell.
secrets:
  r2_url:
    environment: R2_URL

networks:
  # Red privada del stack. La crea Compose.
  internal:

  # Red compartida donde vive el proxy (Traefik) de Dokploy. Es "external":
  # Compose NO la crea, debe existir de antes. En el servidor la crea Dokploy;
  # en local se crea a mano:
  #   docker network create dokploy-network
  dokploy-network:
    external: true

volumes:
  db-data:
  odoo-data:
